name: CI

on:
  pull_request:
  push:
    branches: [__DEFAULT_BRANCH__]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job per check so each shows as its own PR status check.
# Remove the unit-tests job if the repo has no Vitest config; remove the
# a11y job only if the repo will never have a preview URL.
jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v4 on 2026-05-23.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Pinned from actions/setup-node@v6.4.0 on 2026-06-15.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      # Pinned from shopify/theme-check-action@v2.2.0 on 2026-06-15.
      - uses: shopify/theme-check-action@58fd69afdfc30110f997ba9e212b302671e00d3b
        with:
          theme_root: .
          version: 4.1.0

  lint:
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v4 on 2026-05-23.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Pinned from oven-sh/setup-bun@v2 on 2026-05-23.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run check:biome

  typecheck:
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v4 on 2026-05-23.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Pinned from oven-sh/setup-bun@v2 on 2026-05-23.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run check:type

  dead-code:
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v4 on 2026-05-23.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Pinned from oven-sh/setup-bun@v2 on 2026-05-23.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run check:dead-code

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v4 on 2026-05-23.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Pinned from oven-sh/setup-bun@v2 on 2026-05-23.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run check:test

  # Skips (visibly, as its own status check) until the repository variable
  # SHOPIFY_PREVIEW_URL is set.
  a11y:
    runs-on: ubuntu-latest
    if: ${{ vars.SHOPIFY_PREVIEW_URL != '' }}
    env:
      SHOPIFY_PREVIEW_URL: ${{ vars.SHOPIFY_PREVIEW_URL }}
    steps:
      # Pinned from actions/checkout@v4 on 2026-05-23.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Pinned from oven-sh/setup-bun@v2 on 2026-05-23.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Playwright accessibility
        run: bun run check:a11y

      # The axe check writes full per-node violation detail to SHOPIFY_A11Y_OUT_DIR
      # (default test-results/a11y/) and keeps the step log a compact summary.
      # Upload it on failure so the failing selectors are inspectable instead of
      # discarded with the runner. Honor a custom output dir if the repo set one.
      - name: Upload axe reports
        if: ${{ failure() }}
        # Pinned from actions/upload-artifact@v7.0.1 on 2026-06-30.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: axe-a11y-reports
          path: ${{ env.SHOPIFY_A11Y_OUT_DIR || 'test-results/a11y' }}/
          if-no-files-found: ignore
